
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Trading Terminal - Supertrend</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            max-width: 100vw; 
            max-height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #131722; 
            color: #d1d4dc; 
            display: flex; 
            flex-direction: column; 
        }

        #top-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 4px 10px; 
            background-color: #1e222d; 
            border-bottom: 1px solid #2a2e39; 
            flex-shrink: 0; 
            min-height: 42px;
            width: 100%;
        }

        .controls-group { display: flex; align-items: center; gap: 6px; }
        label { font-size: 11px; color: #787b86; }
        select, button { 
            background-color: #2a2e39; 
            color: #d1d4dc; 
            border: 1px solid #363c4e; 
            padding: 3px 6px; 
            border-radius: 4px; 
            font-size: 11px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        select:hover, button:hover { background-color: #363c4e; }
        button.active { background-color: #2962ff; color: #ffffff; border-color: #2962ff; }
        button.inactive { opacity: 0.5; }
        #status { font-size: 11px; color: #2962ff; font-weight: bold; }

        #main-container { 
            display: flex; 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            width: 100%; 
            height: calc(100vh - 42px); 
        }

        #chart { 
            flex: 1; 
            height: 100%; 
            width: 100%; 
            position: relative; 
        }

        #dashboard { 
            width: 200px; 
            min-width: 200px;
            height: 100%;
            background-color: #1e222d; 
            border-left: 1px solid #2a2e39; 
            padding: 6px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            flex-shrink: 0; 
        }

        .dash-module { 
            background-color: #131722; 
            border-radius: 4px; 
            padding: 6px 8px; 
            border: 1px solid #2a2e39; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
        }
        .dash-module h4 { 
            font-size: 10px; 
            color: #787b86; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            margin-bottom: 2px;
        }
        .dash-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 10px; 
            align-items: center; 
        }
        .dash-val { font-weight: bold; }
        
        #timer-progress-container { width: 100%; height: 3px; background-color: #2a2e39; border-radius: 2px; overflow: hidden; margin-top: 2px; }
        #timer-progress { height: 100%; width: 0%; background-color: #2962ff; transition: width 1s linear; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="controls-group">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1s">1 Sec</option>
                <option value="1m">1 Min</option>
                <option value="3m">3 Min</option>
                <option value="5m">5 Min</option>
                <option value="15m" selected>15 Min</option>
                <option value="30m">30 Min</option>
                <option value="45m">45 Min</option>
                <option value="1h">1 Hour</option>
                <option value="4h">4 Hours</option>
                <option value="1d">1 Day</option>
                <option value="1w">1 Week</option>
                <option value="1M">1 Month</option>
            </select>
            <div id="status">Conectando...</div>
        </div>

        <div class="controls-group">
            <button id="toggle-supertrend" class="active">Supertrend</button>
        </div>
    </div>

    <div id="main-container">
        <div id="chart"></div>

        <div id="dashboard">
            <div class="dash-module">
                <h4>Vela Actual</h4>
                <div class="dash-row">
                    <span>Cierre en:</span>
                    <span id="timer-display" class="dash-val">00:00</span>
                </div>
                <div id="timer-progress-container">
                    <div id="timer-progress"></div>
                </div>
            </div>

            <div id="dash-module-supertrend" class="dash-module">
                <h4>Supertrend</h4>
                <div class="dash-row">
                    <span>Señal:</span>
                    <span id="dash-st-signal" class="dash-val">--</span>
                </div>
                <div class="dash-row">
                    <span>Precio:</span>
                    <span id="dash-st-price" class="dash-val">--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const TELEGRAM_CONFIG = { enabled: true, username: "ERC1670" };

        let lastNotifiedSignalTime = null;
        let lastNotifiedSignalType = null;
        let audioCtx = null; 
        let calculatedMarkers = [];
        let showSupertrend = true;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        document.addEventListener('click', initAudioContext, { once: true });

        function playBeepSound(type) {
            try {
                initAudioContext();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (type === "BUY") {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
                }
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.warn("Audio error:", e);
            }
        }

        function sendTelegramAlert(signalType, price, timeframe) {
            if (!TELEGRAM_CONFIG.enabled || !TELEGRAM_CONFIG.username) return;
            const icon = signalType === "BUY" ? "🟢🚀" : "🔴🐻";
            
            const message = `ALERT SUPERTREND BTCUSDT\n\nSeñal: ${signalType} ${icon}\nPrecio Entrada: $${price.toFixed(2)}\nTimeframe: ${timeframe}`;
            const userClean = TELEGRAM_CONFIG.username.replace("@", "");
            const encodedMsg = encodeURIComponent(message);
            fetch(`https://api.callmebot.com/text.php?user=@${userClean}&text=${encodedMsg}`, { mode: 'no-cors' })
                .catch(err => console.error("Error Telegram:", err));
        }

        function evaluateSupertrendAlert(lastSignal, timeframe) {
            if (!lastSignal || !lastSignal.time) return;
            if (lastSignal.time !== lastNotifiedSignalTime && lastSignal.type !== lastNotifiedSignalType) {
                lastNotifiedSignalTime = lastSignal.time;
                lastNotifiedSignalType = lastSignal.type;
                
                playBeepSound(lastSignal.type);
                sendTelegramAlert(lastSignal.type, lastSignal.price, timeframe);
            }
        }

        const statusEl = document.getElementById("status");
        const timeframeSelect = document.getElementById("timeframe");
        const chartContainer = document.getElementById("chart");

        const btnSupertrend = document.getElementById("toggle-supertrend");
        const modSupertrend = document.getElementById("dash-module-supertrend");

        const timerDisplay = document.getElementById("timer-display");
        const timerProgress = document.getElementById("timer-progress");
        const dashStSignal = document.getElementById("dash-st-signal");
        const dashStPrice = document.getElementById("dash-st-price");

        let wsConnection = null;
        let currentCandleData = [];
        let timerInterval = null;

        const klineCache = new Map();

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(42, 46, 57, 0.5)' }, horzLines: { color: 'rgba(42, 46, 57, 0.5)' } },
            timeScale: { borderColor: 'rgba(197, 203, 206, 0.8)', timeVisible: true, secondsVisible: true },
            rightPriceScale: { 
                autoScale: true,
                alignLabels: true,
                borderVisible: true,
                scaleMargins: { top: 0.1, bottom: 0.1 }
            }
        });

        const candlestickSeries = chart.addSeries 
            ? chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645' })
            : chart.addCandlestickSeries({ upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645' });

        const resizeObserver = new ResizeObserver(entries => {
            if (!entries || entries.length === 0) return;
            const { width, height } = entries[0].contentRect;
            chart.applyOptions({ width, height });
        });
        resizeObserver.observe(chartContainer);

        function getIntervalInSeconds(interval) {
            const unit = interval.slice(-1);
            const val = parseInt(interval);
            if (unit === 's') return val;
            if (unit === 'm') return val * 60;
            if (unit === 'h') return val * 3600;
            if (unit === 'd') return val * 86400;
            if (unit === 'w') return val * 604800;
            if (unit === 'M') return val * 2592000;
            return 60;
        }

        function startCandleTimer(interval) {
            if (timerInterval) clearInterval(timerInterval);
            const intervalSecs = getIntervalInSeconds(interval);

            function updateTimer() {
                const nowSecs = Math.floor(Date.now() / 1000);
                const elapsed = nowSecs % intervalSecs;
                const remaining = intervalSecs - elapsed;
                
                const days = Math.floor(remaining / 86400);
                const hours = Math.floor((remaining % 86400) / 3600);
                const mins = Math.floor((remaining % 3600) / 60);
                const secs = remaining % 60;

                if (intervalSecs < 60) {
                    timerDisplay.innerText = `${remaining}s`;
                } else if (days > 0) {
                    timerDisplay.innerText = `${days}d ${hours}h`;
                } else if (hours > 0) {
                    timerDisplay.innerText = `${hours}h ${mins.toString().padStart(2, '0')}m`;
                } else {
                    timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }

                timerProgress.style.width = `${(elapsed / intervalSecs) * 100}%`;
            }

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function getSupertrendMarkers(candles, atrPeriods = 14, multiplier = 2.0) {
            if (!candles || candles.length < atrPeriods + 1) return { stMarkers: [], lastSignal: null };
            const len = candles.length;
            const tr = new Float64Array(len);
            tr[0] = candles[0].high - candles[0].low;

            for (let i = 1; i < len; i++) {
                tr[i] = Math.max(
                    candles[i].high - candles[i].low,
                    Math.abs(candles[i].high - candles[i - 1].close),
                    Math.abs(candles[i].low - candles[i - 1].close)
                );
            }

            const atr = new Float64Array(len);
            let sumTR = 0;
            for (let i = 0; i < atrPeriods; i++) sumTR += tr[i];
            atr[atrPeriods - 1] = sumTR / atrPeriods;
            for (let i = atrPeriods; i < len; i++) atr[i] = (atr[i - 1] * (atrPeriods - 1) + tr[i]) / atrPeriods;

            const up = new Float64Array(len), dn = new Float64Array(len), trend = new Int32Array(len);
            let currentTrend = 1;

            for (let i = 0; i < len; i++) {
                const src = (candles[i].high + candles[i].low) / 2;
                let basicUp = src - (multiplier * atr[i]), basicDn = src + (multiplier * atr[i]);

                if (i === 0) { up[i] = basicUp; dn[i] = basicDn; trend[i] = 1; continue; }

                up[i] = candles[i - 1].close > up[i - 1] ? Math.max(basicUp, up[i - 1]) : basicUp;
                dn[i] = candles[i - 1].close < dn[i - 1] ? Math.min(basicDn, dn[i - 1]) : basicDn;

                if (trend[i - 1] === -1 && candles[i].close > dn[i - 1]) currentTrend = 1;
                else if (trend[i - 1] === 1 && candles[i].close < up[i - 1]) currentTrend = -1;
                else currentTrend = trend[i - 1];

                trend[i] = currentTrend;
            }

            const stMarkers = [];
            let lastSignal = null;

            for (let i = 1; i < len; i++) {
                if (trend[i] === 1 && trend[i - 1] === -1) {
                    stMarkers.push({ time: candles[i].time, position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: 'ST BUY' });
                    lastSignal = { type: 'BUY', price: candles[i].close, time: candles[i].time };
                } else if (trend[i] === -1 && trend[i - 1] === 1) {
                    stMarkers.push({ time: candles[i].time, position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: 'ST SELL' });
                    lastSignal = { type: 'SELL', price: candles[i].close, time: candles[i].time };
                }
            }
            return { stMarkers, lastSignal };
        }

        async function fetchKlines(interval, limit = 500) {
            const cacheKey = `${interval}_${limit}`;
            const now = Date.now();
            if (klineCache.has(cacheKey)) {
                const cached = klineCache.get(cacheKey);
                if (now - cached.timestamp < 5000) return cached.data;
            }

            const is1s = interval === "1s";
            const endpoint = is1s ? 'uiKlines' : 'klines';
            const apiInterval = is1s ? '1s' : interval;

            const urls = [
                `https://api1.binance.com/api/v3/${endpoint}?symbol=BTCUSDT&interval=${apiInterval}&limit=${limit}`,
                `https://api3.binance.com/api/v3/${endpoint}?symbol=BTCUSDT&interval=${apiInterval}&limit=${limit}`,
                `https://api.binance.com/api/v3/${endpoint}?symbol=BTCUSDT&interval=${apiInterval}&limit=${limit}`
            ];

            let data = null;
            for (const url of urls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        data = await res.json();
                        if (data && Array.isArray(data) && data.length > 0) break;
                    }
                } catch (e) {}
            }

            if (!data || !Array.isArray(data)) throw new Error("REST API Error");

            const formatted = data.map(d => ({
                time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
            }));

            klineCache.set(cacheKey, { timestamp: now, data: formatted });
            return formatted;
        }

        async function processIndicators(isInitialLoad = false) {
            if (!currentCandleData || currentCandleData.length === 0) return;

            const { stMarkers, lastSignal } = getSupertrendMarkers(currentCandleData);

            if (showSupertrend) {
                calculatedMarkers = stMarkers;
                if (lastSignal) {
                    dashStSignal.innerText = lastSignal.type;
                    dashStSignal.style.color = lastSignal.type === "BUY" ? "#00e676" : "#ff5252";
                    dashStPrice.innerText = `$${lastSignal.price.toFixed(2)}`;
                    
                    if (isInitialLoad) {
                        lastNotifiedSignalTime = lastSignal.time;
                        lastNotifiedSignalType = lastSignal.type;
                    } else {
                        evaluateSupertrendAlert(lastSignal, timeframeSelect.value);
                    }
                }
            } else {
                calculatedMarkers = [];
                dashStSignal.innerText = "--";
                dashStPrice.innerText = "--";
            }

            candlestickSeries.setMarkers(calculatedMarkers);

            if (isInitialLoad) {
                const totalBars = currentCandleData.length;
                chart.priceScale('right').resetPriceScale();
                chart.timeScale().setVisibleLogicalRange({ from: totalBars - 60, to: totalBars + 5 });
            }
        }

        async function renderChart() {
            statusEl.style.display = "block";
            statusEl.style.color = "#2962ff";
            statusEl.innerText = "Cargando datos...";

            lastNotifiedSignalTime = null;
            lastNotifiedSignalType = null;

            const selectedInterval = timeframeSelect.value;
            startCandleTimer(selectedInterval);

            try {
                currentCandleData = await fetchKlines(selectedInterval, 500);
                candlestickSeries.setData(currentCandleData);
                await processIndicators(true);
                connectWebSocket(selectedInterval);
            } catch (err) {
                statusEl.innerText = "Conectando WS...";
                statusEl.style.color = "#ff9100";
                connectWebSocket(selectedInterval);
            }
        }

        function connectWebSocket(interval) {
            if (wsConnection) {
                wsConnection.onclose = null;
                wsConnection.close();
            }
            const wsInterval = interval === "1s" ? "1s" : interval;
            wsConnection = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${wsInterval}`);

            wsConnection.onopen = () => { statusEl.style.display = "none"; };
            wsConnection.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                const k = message.k;
                const updatedCandle = {
                    time: Math.floor(k.t / 1000), open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v)
                };

                candlestickSeries.update(updatedCandle);

                if (currentCandleData.length > 0) {
                    const lastIdx = currentCandleData.length - 1;
                    if (currentCandleData[lastIdx].time === updatedCandle.time) {
                        currentCandleData[lastIdx] = updatedCandle;
                    } else {
                        currentCandleData.push(updatedCandle);
                    }
                    if (currentCandleData.length > 500) currentCandleData.shift();
                    
                    if (k.x) {
                        await processIndicators(false);
                    }
                }

                if (statusEl.style.display !== "none") {
                    statusEl.style.display = "none";
                }
            };
        }

        document.addEventListener("visibilitychange", async function () {
            if (document.visibilityState === "visible") {
                statusEl.style.display = "block";
                statusEl.innerText = "Resincronizando...";
                statusEl.style.color = "#2962ff";

                const isWsInactive = !wsConnection || wsConnection.readyState === WebSocket.CLOSED || wsConnection.readyState === WebSocket.CLOSING;
                try {
                    const selectedInterval = timeframeSelect.value;
                    currentCandleData = await fetchKlines(selectedInterval, 500);
                    candlestickSeries.setData(currentCandleData);
                    await processIndicators(false);

                    if (isWsInactive) connectWebSocket(selectedInterval);
                    else statusEl.style.display = "none";
                } catch (err) {
                    connectWebSocket(timeframeSelect.value);
                }
            }
        });

        btnSupertrend.addEventListener('click', async () => {
            showSupertrend = !showSupertrend;
            btnSupertrend.classList.toggle('active', showSupertrend);
            btnSupertrend.classList.toggle('inactive', !showSupertrend);
            modSupertrend.style.display = showSupertrend ? "flex" : "none";
            await processIndicators(false);
        });

        timeframeSelect.addEventListener('change', renderChart);

        renderChart();
    });
    </script>
</body>
</html>
